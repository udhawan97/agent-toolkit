name: validate

on:
  pull_request:
  push:
    branches: [main, stable]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  portable-package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Validate package
        shell: bash
        run: python bin/agent-kit validate
      - name: Run regression tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Validate POSIX setup launcher
        shell: bash
        run: sh -n bin/setup
      - name: Validate PowerShell setup launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bin/setup.ps1 help
