name: Bug report
description: Report a reproducible setup, marketplace, plugin, or documentation problem.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Agent Toolkit. Remove tokens, personal paths, account identifiers, and private project content before posting.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Quick setup launcher
        - Codex marketplace or plugin
        - Claude Code marketplace or plugin
        - Skill behavior
        - Documentation or visual asset
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: macOS 15.6, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Client and Python versions
      description: Include only the clients you use.
      placeholder: Codex 0.x; Claude Code 2.x; Python 3.12
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and smallest relevant error
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor output
      description: Run `./bin/agent-kit doctor --native` when safe, then remove private data.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, personal paths, and private project content.
          required: true
