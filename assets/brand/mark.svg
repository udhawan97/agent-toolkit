<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Agent Toolkit mark</title>
  <desc id="desc">Two colored rails converge on a central modular cube.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111e31"/>
      <stop offset="1" stop-color="#060b13"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#36d7ff"/>
      <stop offset="1" stop-color="#1784ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a77bff"/>
      <stop offset="1" stop-color="#6946ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="156" height="156" rx="35" fill="url(#canvas)" stroke="#263b57" stroke-width="4"/>
  <path d="M18 51H55L73 69" fill="none" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M18 109H55L73 91" fill="none" stroke="url(#violet)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M87 69L105 51H142" fill="none" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M87 91L105 109H142" fill="none" stroke="url(#violet)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M80 43L112 61V99L80 117L48 99V61Z" fill="#101a29" stroke="#f5c36a" stroke-width="3"/>
  <path d="M80 43L112 61L80 80L48 61Z" fill="#ffd783"/>
  <path d="M48 61L80 80V117L48 99Z" fill="#d98c26"/>
  <path d="M112 61L80 80V117L112 99Z" fill="#f2aa3f"/>
  <path d="M80 80V117M48 61L80 80L112 61" fill="none" stroke="#fff0c7" stroke-opacity=".55" stroke-width="2"/>
</svg>
