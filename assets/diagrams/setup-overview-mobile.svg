<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Toolkit mobile setup overview</title>
  <desc id="desc">One command detects Codex and Claude Code, installs the current allowlisted stack, and checks the result. Setup does not copy client credentials or authentication state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111933"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36d7ff"/>
      <stop offset="0.5" stop-color="#9c6cff"/>
      <stop offset="1" stop-color="#f5c36a"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="640" height="900" rx="28"/>
    </clipPath>
  </defs>

  <rect width="640" height="900" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <circle cx="586" cy="58" r="145" fill="#9c6cff" opacity="0.06"/>
    <circle cx="38" cy="846" r="165" fill="#36d7ff" opacity="0.05"/>
  </g>
  <rect x="1" y="1" width="638" height="898" rx="27" fill="none" stroke="#263451" stroke-width="2"/>

  <text x="40" y="54" fill="#8fa2c3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2">ONE COMMAND · CHECKED RESULT</text>
  <path d="M76 229v33M76 416v33M76 603v33" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M65 251l11 11 11-11M65 438l11 11 11-11M65 625l11 11 11-11" fill="none" stroke="#8fa2c3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(40 82)">
    <rect width="560" height="147" rx="18" fill="#111d32" stroke="#2b3b5d" stroke-width="2"/>
    <rect x="26" y="32" width="56" height="46" rx="8" fill="#0a1425" stroke="#36d7ff" stroke-width="2"/>
    <path d="M40 48l9 8-9 8M56 64h13" fill="none" stroke="#36d7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="57" fill="#f6f8fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">1 · Run setup</text>
    <text x="112" y="88" fill="#9eacc4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Paste one command. Nothing runs on clone.</text>
  </g>

  <g transform="translate(40 269)">
    <rect width="560" height="147" rx="18" fill="#111d32" stroke="#2b3b5d" stroke-width="2"/>
    <circle cx="49" cy="55" r="24" fill="#36d7ff" opacity="0.15" stroke="#36d7ff" stroke-width="2"/>
    <circle cx="79" cy="55" r="24" fill="#9c6cff" opacity="0.15" stroke="#9c6cff" stroke-width="2"/>
    <text x="41" y="62" fill="#e9fbff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">C</text>
    <text x="71" y="62" fill="#f1ebff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">A</text>
    <text x="128" y="57" fill="#f6f8fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">2 · Detect clients</text>
    <text x="128" y="88" fill="#9eacc4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Codex, Claude Code, or both.</text>
  </g>

  <g transform="translate(40 456)">
    <rect width="560" height="147" rx="18" fill="#111d32" stroke="#2b3b5d" stroke-width="2"/>
    <path d="M30 67l36-20 36 20-36 20-36-20zM30 55l36-20 36 20M30 79l36 20 36-20" fill="none" stroke="#9c6cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="57" fill="#f6f8fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">3 · Install stack</text>
    <text x="128" y="88" fill="#9eacc4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Skills, plugins, tools, and guidance.</text>
  </g>

  <g transform="translate(40 643)">
    <rect width="560" height="147" rx="18" fill="#111d32" stroke="#3d4760" stroke-width="2"/>
    <path d="M66 25l34 13v25c0 23-14 38-34 47-20-9-34-24-34-47V38l34-13z" fill="#f5c36a" opacity="0.12" stroke="#f5c36a" stroke-width="2.5"/>
    <path d="M50 65l11 11 22-25" fill="none" stroke="#f5c36a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="57" fill="#f6f8fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">4 · Run doctor</text>
    <text x="128" y="88" fill="#9eacc4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Pass—or stop with a clear error.</text>
  </g>

  <rect x="40" y="823" width="560" height="44" rx="12" fill="#0a1425" stroke="#263451"/>
  <circle cx="65" cy="845" r="6" fill="#23b8a6"/>
  <text x="83" y="851" fill="#c8d4e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">allowlisted · receipted · credentials not copied</text>
</svg>
